[package]
name = "dpt-client"
description = "Client for the Sony DPT-RP1 / DPT-CP1 Digital Paper local REST API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["discovery"]
# mDNS discovery of readers on the local network
discovery = ["dep:mdns-sd"]

[dependencies]
aes = "0.9.4"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
form_urlencoded = "1.2.2"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hmac = "0.13.0"
mdns-sd = { version = "0.21.7", optional = true }
num-bigint = "0.5.1"
pbkdf2 = "0.13.0"
percent-encoding = "2.3.2"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = "3.5.2"

[dev-dependencies]
tiny_http = "0.12.0"
