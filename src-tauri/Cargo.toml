[package]
name = "inkboard-app"
description = "Inkboard: manage a Sony DPT-RP1 and use it as an e-ink dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "inkboard-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
dirs = "7.0.0"
dpt-client = { version = "0.1.0", path = "../crates/dpt-client" }
flate2 = "1.1.11"
futures-util = "0.3.34"
mtp-rs = "0.38.1"
percent-encoding = "2.3.2"
png = "0.18.1"
rsadb = { version = "0.1.1", default-features = false, features = ["usb"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "sync", "time", "rt"] }
ureq = "3.5.2"

[dev-dependencies]
mtp-rs = { version = "0.38.1", features = ["virtual-device"] }
tauri = { version = "2.12.5", features = ["test"] }
